# /etc/scanpi.conf — settings for the scan pipeline. Edit, no restart needed.

# rclone destination. "gdrive:" is the folder set by root_folder_id.
DEST="gdrive:"

# Optional subfolders under DEST, as a date(1) format. "" = all in one folder.
# Example: SUBDIR_FORMAT="%Y/%m"  ->  2026/10/scan_....pdf
SUBDIR_FORMAT=""

# Tesseract OCR language(s), joined with "+", e.g. "eng+deu".
# Each needs its package: sudo apt install tesseract-ocr-<lang>
OCR_LANG="eng"

# Scanner settings
SCAN_SOURCE="ADF Duplex"     # or "ADF Front" for single-sided
SCAN_MODE="Color"            # Color | Gray | Lineart
SCAN_RESOLUTION="300"

# Extra scanimage options. Check what your scanner supports with:
#   sudo systemctl stop scanbd; scanimage --help -d "$(scanimage -f '%d' | head -1)"
# Useful fujitsu-backend ones: --swskip=5 (drop blank pages), --swdeskew=yes, --swcrop=yes
SCAN_EXTRA=""
