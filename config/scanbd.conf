# Minimal scanbd config: the scanner's Scan button runs scan.script.
global {
    debug       = true
    debug-level = 2

    user  = saned
    group = scanner

    saned     = "/usr/sbin/saned"
    saned_opt = {}
    saned_env = { "SANE_CONFIG_DIR=/etc/scanbd/sane.d" }

    scriptdir = /etc/scanbd/scripts
    timeout   = 500
    pidfile   = "/var/run/scanbd.pid"

    environment {
        device = "SCANBD_DEVICE"
        action = "SCANBD_ACTION"
    }

    action scan {
        filter = "^scan.*"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Scan to Google Drive"
        script = "scan.script"
    }
}
